name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Builds the module against Fuxedo (the open source, freely
# redistributable Tuxedo implementation), boots the demo domain and runs
# the buffer and end-to-end demo checks. Oracle Tuxedo 12.x/22.1
# compatibility is verified by the maintainer on private infrastructure
# because the Oracle installer cannot be fetched in CI.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build dependencies
        run: pip install pybind11 setuptools wheel

      - name: Fetch and build Fuxedo
        run: |
          git clone --depth 1 https://github.com/fuxedo/fuxedo.git /tmp/fuxedo
          cd /tmp/fuxedo
          ./autogen.sh
          ./configure --prefix=/tmp/fuxinst
          make -j"$(nproc)"
          make check
          make install

      - name: Build and install the tuxedo module against Fuxedo
        run: |
          export TUXDIR=/tmp/fuxinst
          python3 -m pip install .
          export LD_LIBRARY_PATH="$TUXDIR/lib:${LD_LIBRARY_PATH:-}"
          python3 -c "import tuxedo; print('tuxedo import ok')"
          python3 -c "import tuxedowsc; print('tuxedowsc import ok')"

      - name: Run demo/py3 end to end
        run: |
          export TUXDIR=/tmp/fuxinst
          export PATH="$TUXDIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TUXDIR/lib:${LD_LIBRARY_PATH:-}"
          cd demo/py3
          make default
        timeout-minutes: 10

      - name: Run buffer API self-check
        run: |
          export TUXDIR=/tmp/fuxinst
          export LD_LIBRARY_PATH="$TUXDIR/lib:${LD_LIBRARY_PATH:-}"
          export FLDTBLDIR32="$TUXDIR/udataobj:$PWD/demo/py3"
          export FIELDTBLS32=tpadm,demo
          python3 demo/py3/buf.py < demo/py3/in.ud

  oracle:
    # Real Oracle Tuxedo, from prebuilt installation trees hosted as
    # PRIVATE release assets (the installer needs an Oracle account, so
    # CI cannot fetch it; see README "CI against Oracle Tuxedo").
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "12.2.2"
            asset: tuxedo-12.2.2-prebuilt.tar.gz
            needs-nsl: ""
          - name: "22.1"
            asset: tuxedo-22.1-prebuilt.tar.gz
            needs-nsl: "yes"
    name: Oracle Tuxedo ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: pip install pybind11 setuptools wheel

      - name: Install libnsl2 (22.1 runtime dependency)
        if: matrix.needs-nsl != ''
        run: sudo apt-get update && sudo apt-get install -y libnsl2

      - name: Fetch the prebuilt Oracle Tuxedo tree
        env:
          GH_TOKEN: ${{ secrets.INSTALLERS_TOKEN }}
        run: |
          gh release download oracle-tuxedo \
            --repo aivarsk/tuxedo-installers \
            --pattern "${{ matrix.asset }}" --clobber --dir /tmp
          mkdir -p "$HOME/oracle"
          tar xzf "/tmp/${{ matrix.asset }}" -C "$HOME/oracle"
          TUXDIR=$(echo "$HOME"/oracle/tuxedo*)
          echo "TUXDIR=$TUXDIR" >> "$GITHUB_ENV"

      - name: Build and install the tuxedo module
        run: |
          python3 -m pip install .
          export LD_LIBRARY_PATH="$TUXDIR/lib:${LD_LIBRARY_PATH:-}"
          python3 -c "import tuxedo; print('tuxedo import ok')"
          python3 -c "import tuxedowsc; print('tuxedowsc import ok')"

      - name: Run demo/py3 end to end
        run: |
          export PATH="$TUXDIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TUXDIR/lib:${LD_LIBRARY_PATH:-}"
          cd demo/py3
          make default
        timeout-minutes: 15
